# TrueX Proxies + Market Maker - Host Network Mode (direct WireGuard access)
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # Redis - local to Hetzner, no external dependency
  redis:
    image: redis:7-alpine
    container_name: truex-redis
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --bind 127.0.0.1
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # FIX OE Proxy - forwards to TrueX prod via WireGuard
  fix-proxy:
    build: .
    container_name: truex-fix-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - FIX_PROXY_PORT=3004
      - TRUEX_UPSTREAM_HOST=${TRUEX_PROD_HOST:-10.20.6.11}
      - TRUEX_UPSTREAM_PORT=19484
    command: ["bun", "src/proxy/fix-proxy-server.js"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # FIX MD Proxy - market data feed
  md-proxy:
    build: .
    container_name: truex-md-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - FIX_PROXY_PORT=3005
      - TRUEX_UPSTREAM_HOST=${TRUEX_PROD_HOST:-10.20.6.11}
      - TRUEX_UPSTREAM_PORT=20484
    command: ["bun", "src/proxy/fix-proxy-server.js"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Market Maker - FIX via local proxy, REST direct via WireGuard
  market-maker:
    build: .
    container_name: truex-market-maker
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
      fix-proxy:
        condition: service_started
    env_file: .env
    environment:
      - NODE_ENV=production
      - TRUEX_FIX_HOST=127.0.0.1
      - TRUEX_FIX_PORT=3004
      - TRUEX_REST_URL=http://${TRUEX_PROD_HOST:-10.20.6.11}:9742
      - REDIS_URL=redis://127.0.0.1:6379
      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/market-maker.log
      # REST reconciliation owns only this instrument and durable maker ID
      # namespace. Both are non-secret and must remain stable across restarts.
      - TRUEX_INSTRUMENT_ID=${TRUEX_INSTRUMENT_ID:?required}
      - TRUEX_ORDER_ID_NAMESPACE=${TRUEX_ORDER_ID_NAMESPACE:?required}
      # Required, non-secret maker-continuity obligations. Compose fails before
      # restart if any value is absent from the operator-managed .env file.
      - MM_MIN_ACTIVE_LEVELS_PER_SIDE=${MM_MIN_ACTIVE_LEVELS_PER_SIDE:?required}
      - MM_MIN_FUNDED_QUOTE_SIZE_BTC=${MM_MIN_FUNDED_QUOTE_SIZE_BTC:?required}
      - MM_L1_RESERVE_BASE_BTC=${MM_L1_RESERVE_BASE_BTC:?required}
      - MM_L1_RESERVE_QUOTE_PYUSD=${MM_L1_RESERVE_QUOTE_PYUSD:?required}
      - MM_MAX_SIDE_GAP_MS=${MM_MAX_SIDE_GAP_MS:?required}
      - MM_SIDE_GAP_ALERT_THRESHOLD_MS=${MM_SIDE_GAP_ALERT_THRESHOLD_MS:?required}
      - MM_SIDE_GAP_ALERT_RATE_LIMIT_MS=${MM_SIDE_GAP_ALERT_RATE_LIMIT_MS:?required}
      - MM_DEGRADED_MAX_LEVELS=${MM_DEGRADED_MAX_LEVELS:?required}
      - MM_DEGRADED_SIZE_FACTOR=${MM_DEGRADED_SIZE_FACTOR:?required}
      - MM_DEFENSIVE_SPREAD_FLOOR_BPS=${MM_DEFENSIVE_SPREAD_FLOOR_BPS:?required}
      - TRUEX_STARTUP_CANCEL_VERIFY_TIMEOUT_MS=${TRUEX_STARTUP_CANCEL_VERIFY_TIMEOUT_MS:-30000}
      - TRUEX_STARTUP_CANCEL_VERIFY_INTERVAL_MS=${TRUEX_STARTUP_CANCEL_VERIFY_INTERVAL_MS:-500}
      # Strict maker sends use fresh TrueX EBBO as the venue-crossing authority.
      - TRUEX_MAKER_SAFETY_STRICT=${TRUEX_MAKER_SAFETY_STRICT:?required}
      - TRUEX_MAKER_MARKETABLE_ACTION=${TRUEX_MAKER_MARKETABLE_ACTION:?required}
      - TRUEX_MAKER_EBBO_MAX_AGE_MS=${TRUEX_MAKER_EBBO_MAX_AGE_MS:?required}
      - TRUEX_ALO_RETRY_COOLDOWN_MS=${TRUEX_ALO_RETRY_COOLDOWN_MS:?required}
      - TRUEX_ALO_RETRY_MAX_ENTRIES=${TRUEX_ALO_RETRY_MAX_ENTRIES:?required}
    volumes:
      - mm-logs:/app/logs
    command: ["bun", "scripts/run-prod.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3100/api/v1/health | grep -q '\"status\":\"healthy\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  # Log Exporter - ships logs to mech-storage every 5 minutes
  log-exporter:
    build: .
    container_name: truex-log-exporter
    restart: unless-stopped
    network_mode: host
    depends_on:
      - market-maker
    env_file: .env
    environment:
      - LOG_FILE=/app/logs/market-maker.log
      - EXPORT_INTERVAL_MS=300000
    volumes:
      - mm-logs:/app/logs
    command: ["bun", "scripts/log-exporter.js"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  redis-data:
    driver: local
  mm-logs:
    driver: local
